# This branch deploys the standalone Petros app.
[build]
  base = "prototype/v2"
  # Install the standalone lockfile and invoke its Next CLI directly.
  command = "npm ci --workspaces=false --include=dev && node ./node_modules/next/dist/bin/next build --webpack"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--workspaces=false"
